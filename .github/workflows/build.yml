# Builds every version of Gokart Grand Prix on each push to main:
# Windows installer + portable exe, Mac dmg, Linux AppImage, Android apk, and the web app on GitHub Pages.
# Everything lands in one GitHub Release, ready to share.
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: |
              dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create the Android project around the game
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
      - name: Landscape, full screen, game icon
        run: |
          python3 - <<'PY'
          import re, pathlib, shutil
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml'); s = m.read_text()
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="sensorLandscape"', 1)
          m.write_text(s)
          st = pathlib.Path('android/app/src/main/res/values/styles.xml'); t = st.read_text()
          t = re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)', r'\1<item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>', t, count=1)
          st.write_text(t)
          bg = pathlib.Path('android/app/src/main/res/values/ic_launcher_background.xml')
          if bg.exists(): bg.write_text(re.sub(r'#[0-9A-Fa-f]{6,8}', '#0E1114', bg.read_text()))
          for d in pathlib.Path('build/android-icons').iterdir():
              dst = pathlib.Path('android/app/src/main/res') / d.name
              dst.mkdir(parents=True, exist_ok=True)
              for f in d.iterdir(): shutil.copy(f, dst / f.name)
          PY
          npx cap sync android
      - name: Build the apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Gokart-Grand-Prix-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: Gokart-Grand-Prix-Android.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the web app (phones, iPhone included) to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true

  release:
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gokart Grand Prix 1.0.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            ## Download

            | Device | File |
            | --- | --- |
            | Windows | **Gokart-Grand-Prix-Setup.exe** installs with a desktop shortcut. **Gokart-Grand-Prix-Portable.exe** runs without installing. |
            | Mac | **Gokart-Grand-Prix-Mac.dmg**: drag the app into Applications, then right-click it and choose Open the first time. |
            | Android | **Gokart-Grand-Prix-Android.apk**: open it on the phone and allow installing from this source. |
            | iPhone / iPad | Open https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ in Safari, tap Share, then Add to Home Screen. |
            | Linux | **Gokart-Grand-Prix-Linux.AppImage**: make it executable and run it. |

            Windows may show "Windows protected your PC" because the app is not code-signed: click **More info**, then **Run anyway**.

            Online races work between every version: the host sends an invite code, the friend sends a reply code back.
